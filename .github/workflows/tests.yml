name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      # A plain venv rather than `uv sync`: the universal lock settles on an
      # older pytest-homeassistant-custom-component, and this should test the
      # newest Home Assistant. --no-sources ignores the sibling-checkout
      # override in pyproject.toml, so aiolumagen comes from PyPI at the
      # version the manifest pins.
      - name: Install
        run: |
          uv venv
          uv pip install --no-sources --group dev \
            "$(jq -r '.requirements[]' custom_components/lumagen/manifest.json)"
          uv pip list | grep -E '^(homeassistant|aiolumagen) '

      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy custom_components
      - run: uv run --no-sync pytest -q
