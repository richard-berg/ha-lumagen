[project]
name = "ha-lumagen"
version = "0.3.0"
description = "Home Assistant custom integration for Lumagen Radiance Pro (development metadata; the deployable artifact is custom_components/lumagen/)."
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    # pytest-homeassistant-custom-component pins an HA core version that
    # tracks the current HA release; uv resolves the rest (pytest, voluptuous,
    # homeassistant itself) transitively.
    "pytest-homeassistant-custom-component>=0.13",
    # HA's `usb` integration imports aiousbwatcher; it's an extra on the
    # homeassistant package, so pull it in explicitly for the test env.
    "aiousbwatcher",
    # Also for HA's `usb` integration: its serial_proxy_stub imports
    # serialx.platforms.serial_esphome at module scope, which imports
    # aioesphomeapi — yet usb/manifest.json doesn't list it (HA relies on the
    # `esphome` integration having installed it). Nothing in our own
    # dependency tree pulls it any more: aiolumagen deliberately dropped the
    # serialx[esphome] extra so it can't move the version HA pins for its
    # ESPHome integration. So the test env has to ask for it directly, or
    # importing `usb` fails at collection.
    "aioesphomeapi",
    # We import from aiolumagen in the integration code, so it must be
    # resolvable from the test env. (aiolumagen was renamed from pylumagen
    # to avoid a PyPI collision with an unrelated published package — see
    # the sibling repo's README for why.)
    "aiolumagen",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.uv.sources]
# During development, point at the sibling aiolumagen repo by path.
aiolumagen = { path = "../aiolumagen", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = false  # HA's own stubs aren't strict-clean; keep false for v0.1
warn_unreachable = true

# Since HA 2026.9, `import voluptuous` resolves to probatio at runtime, and HA's
# signatures expect probatio types. The import stays because it's the only one
# that works on every supported HA; treat it as untyped so mypy agrees.
[[tool.mypy.overrides]]
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
